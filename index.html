<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週イチ体重</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #24231f; --muted: #6f6c63;
    --line: #dedbd2; --accent: #2f6f62; --accent-text: #ffffff; --warn: #a3481f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1c1a; --card: #262725; --text: #ecebe6; --muted: #a5a39b;
      --line: #3c3d39; --accent: #7cc4b2; --accent-text: #14211e; --warn: #eb9a72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.1rem; margin: 0 0 16px; color: var(--muted); font-weight: 600; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 14px; }
  #status { font-size: 1.35rem; font-weight: 700; margin: 0 0 14px; }
  form.entry { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  label { display: block; font-size: .85rem; color: var(--muted); }
  input {
    display: block; width: 100%; margin-top: 4px; padding: 10px; font: inherit;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  .kg { flex: 1 1 120px; } .kg input { font-size: 1.4rem; font-weight: 700; }
  .date { flex: 1 1 150px; }
  form.entry input, form.entry button { height: 52px; }
  button {
    padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer;
    color: var(--accent-text); background: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
  }
  button.sub { color: var(--text); background: transparent; border-color: var(--line); font-weight: 400; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
  .stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .8rem; color: var(--muted); }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 130px; }
  #message { min-height: 1.5em; margin: 10px 0 0; font-size: .9rem; color: var(--warn); }
  details summary { cursor: pointer; font-weight: 700; }
  details .row { margin-top: 12px; }
  .note { font-size: .8rem; color: var(--muted); margin: 12px 0 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>週イチ体重</h1>

  <section>
    <p id="status"></p>
    <form class="entry" id="entry-form">
      <label class="kg">体重（kg）
        <input id="kg" type="number" inputmode="decimal" step="0.1" min="20" max="400" required>
      </label>
      <label class="date">日付
        <input id="date" type="date" required>
      </label>
      <button type="submit">記録</button>
    </form>
    <p id="message" role="status"></p>
  </section>

  <section>
    <div class="stats" id="stats"></div>
  </section>

  <section>
    <h2>推移</h2>
    <div id="chart"></div>
  </section>

  <section>
    <h2>これまでの記録</h2>
    <ul id="history"></ul>
  </section>

  <section>
    <details>
      <summary>設定とバックアップ</summary>
      <form class="row" id="settings-form">
        <label>身長（cm）<input id="height" type="number" step="0.1" min="50" max="260"></label>
        <label>目標体重（kg）<input id="goal" type="number" step="0.1" min="20" max="400"></label>
        <button type="submit" class="sub">設定を保存</button>
      </form>
      <div class="row" style="margin-top:12px">
        <button type="button" class="sub" id="export">バックアップを保存</button>
        <button type="button" class="sub" id="import">バックアップを読み込む</button>
        <input id="import-file" type="file" accept="application/json" hidden>
      </div>
      <p class="note">記録はこのブラウザの中だけに保存され、外部には送信されません。ブラウザのデータを消すと記録も消えるので、ときどきバックアップを保存してください。</p>
    </details>
  </section>
</main>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
